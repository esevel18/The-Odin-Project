<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>

<body>
    <div class="player-popup">
        <label for="player1">Player 1 Name: </label>
        <input id="player1" type="text" placeholder="Enter Your Name">

        <label for="player2">Player 2 Name: </label>
        <input id="player2" type="text" placeholder="Enter Your Name">

        <div class="center-btn">
            <input id="play-button" type="button" value="Play">
        </div>
    </div>

    <div class="score-container hidden">
        <h1>Score:</h1>
        <h2>Player 1: 0</h2>
        <h2>Player 2: 0</h2>
    </div>

    <div class="tic-tac-toe-container hidden">
        <h1>Play Tic Tac Toe Together!</h1>
        <main>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </main>
    </div>

    <div class="popup hidden">
        <!-- <h1></h1> -->
        <h1>Click Here to Start a New Game</h1>
        <input type="button" value="New Game">
    </div>

</body>

</html>
